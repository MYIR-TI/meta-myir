#@TYPE: Machine
#@NAME: MYD-YM62LX eMMC
#@DESCRIPTION: Machine configuration for the MYIR MYD-YM62LX eMMC Board

require conf/machine/include/am62lxx-rt.inc
require conf/machine/include/ti-extras.inc

IMAGE_FSTYPES += "ubifs ubi"

MKUBIFS_ARGS ?= "-F -m 4096 -e 258048 -c 8500"

UBINIZE_ARGS ?= "-m 4096 -p 256KiB -s 1024 -O 1024"

KERNEL_DEVICETREE_PREFIX = " \
    myir/myd-ym62lx \
"

KERNEL_DEVICETREE = ""

UBOOT_MACHINE = "myd_ym62lx_emmc_defconfig"

TF_A_DTB_NAME = "myd-ym62lx-ddr-1g.dtb"

DEFAULT_TIMEZONE = "Asia/Shanghai"
